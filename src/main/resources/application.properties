spring.application.name=backend-music
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:backendmusic}
spring.datasource.username=${DB_USERNAME:backendmusic}
spring.datasource.password=${DB_PASSWORD:backendmusic}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
